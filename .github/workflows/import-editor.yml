name: Import verified Pixel Forge editor

on:
  push:
    branches: [main]
    paths: ['.pixel-forge-import/**']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconstruct and commit the checksum-verified original
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, urllib.request
          repo = os.environ['REPOSITORY']
          source = os.environ['SOURCE_SHA']
          root = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def api(path, data=None, method=None):
              body = None if data is None else json.dumps(data).encode()
              request = urllib.request.Request(root + path, data=body, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          commit = api('/git/commits/' + source)
          entries = api('/git/trees/' + commit['tree']['sha'] + '?recursive=1')['tree']
          parts = sorted((x for x in entries if x['path'].startswith('.pixel-forge-import/part-') and x['type'] == 'blob'), key=lambda x: x['path'])
          if len(parts) != 10:
              raise RuntimeError('Expected exactly ten transport parts')
          packed = b''.join(base64.b64decode(api('/git/blobs/' + x['sha'])['content']) for x in parts)
          content = lzma.decompress(base64.b64decode(packed, validate=True))
          expected = '2249003fce634c5df6ab60deba70d9fb7c60936755ae575d246b05345f1cacc3'
          if len(content) != 151548 or hashlib.sha256(content).hexdigest() != expected:
              raise RuntimeError('Editor checksum mismatch; no files will be published')
          head = api('/git/ref/heads/main')['object']['sha']
          current = api('/git/commits/' + head)
          blob = api('/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
          changes = [{'path': 'index.html', 'mode': '100644', 'type': 'blob', 'sha': blob['sha']}, {'path': '.nojekyll', 'mode': '100644', 'type': 'blob', 'content': ''}]
          changes += [{'path': x['path'], 'mode': '100644', 'type': 'blob', 'sha': None} for x in parts]
          tree = api('/git/trees', {'base_tree': current['tree']['sha'], 'tree': changes})
          result = api('/git/commits', {'message': 'Publish original Pixel Forge sprite and animation editor', 'tree': tree['sha'], 'parents': [head]})
          api('/git/refs/heads/main', {'sha': result['sha'], 'force': False}, 'PATCH')
          print('Published commit:', result['sha'])
          print('Verified index.html SHA-256:', expected)
          print('Verified index.html Git blob:', blob['sha'])
          PY
